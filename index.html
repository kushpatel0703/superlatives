<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friendsgiving Superlatives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: a dim dinner-party stage. The host screen is a TV slide; the phone page is a stack of big tap targets. */
  --bg: #1c0e19;
  --panel: #2a1626;
  --line: #4b2b43;
  --ink: #f8ecdc;
  --muted: #c3a9b8;
  --gold: #f2b134;
  --cran: #d0394f;
  --sage: #8cc084;
  --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Outfit", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #351a2f 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 400; }
h2 { font-family: var(--display); font-size: 1.25rem; letter-spacing: .01em; color: var(--gold); }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.fine { color: var(--muted); font-size: .9rem; }

.btn {
  appearance: none; border: 1.5px solid var(--line); background: var(--panel);
  border-radius: 999px; padding: .6rem 1.15rem; cursor: pointer; font-weight: 600;
  transition: transform .08s ease, background .15s ease, border-color .15s ease;
}
.btn:hover { border-color: var(--muted); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #2a1408; }
.btn.primary:hover { background: #ffc24f; }
.btn.big { font-size: 1.15rem; padding: .85rem 1.6rem; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 1.25rem 1.35rem; display: grid; gap: .85rem; align-content: start; }

/* ---------- Chooser ---------- */
.chooser { min-height: 100%; display: grid; place-content: center; gap: 1.5rem; padding: 2rem 1rem; text-align: center; }
.chooser .logo { font-family: var(--display); font-size: clamp(2.4rem, 8vw, 4.5rem); line-height: .95; color: var(--gold); }
.chooser .logo span { color: var(--ink); display: block; }
.chooser .opts { display: grid; gap: .75rem; max-width: 420px; width: 100%; margin: 0 auto; }

/* ---------- Host: setup ---------- */
.setup { max-width: 1180px; margin: 0 auto; padding: 2rem 1.25rem 3rem; display: grid; gap: 1.25rem; grid-template-columns: 1.05fr 1fr; align-items: start; }
.setup .col { display: grid; gap: 1.25rem; }
.brand h1 { font-family: var(--display); font-size: clamp(2.6rem, 6vw, 4.6rem); line-height: .92; color: var(--gold); }
.brand h1 span { color: var(--ink); }
.brand .lede { margin-top: .9rem; color: var(--muted); max-width: 46ch; font-size: 1.05rem; }
.conn { margin-top: .8rem; display: inline-flex; align-items: center; gap: .5rem; font-size: .92rem; color: var(--muted); }
.conn::before { content: ""; width: .6rem; height: .6rem; border-radius: 50%; background: var(--muted); }
.conn.ok::before { background: var(--sage); box-shadow: 0 0 0 4px rgba(140,192,132,.18); }
.conn.bad::before { background: var(--cran); }
.join ol { margin: 0; padding-left: 1.3rem; display: grid; gap: .3rem; }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .5rem; }
.chip { display: inline-flex; align-items: center; gap: .45rem; padding: .4rem .5rem .4rem .8rem; border-radius: 999px; background: #3a1f34; border: 1px solid var(--line); font-weight: 500; max-width: 100%; }
.chip .dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--line); flex: none; }
.chip .dot.on { background: var(--sage); }
.chip .x { border: 0; background: transparent; color: var(--muted); cursor: pointer; width: 1.6rem; height: 1.6rem; border-radius: 50%; font-size: 1.1rem; line-height: 1; }
.chip .x:hover { background: var(--line); color: var(--ink); }
.chip .nm { overflow-wrap: anywhere; }
.empty { color: var(--muted); font-style: italic; }
.inline-form { display: flex; gap: .5rem; }
.inline-form input { flex: 1; min-width: 0; }
input[type=text], select, textarea {
  background: #1f1019; border: 1.5px solid var(--line); border-radius: 14px; padding: .65rem .85rem; width: 100%;
}
input[type=text]:focus, select:focus, textarea:focus { border-color: var(--gold); outline: none; }
textarea { min-height: 300px; resize: vertical; line-height: 1.55; font-size: .97rem; }
.opts-row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
.opts-row label { display: inline-flex; gap: .5rem; align-items: center; }
.opts-row select { width: auto; }
.awards .head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.awards .count { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }

/* ---------- Host: stage ---------- */
.stage { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding: 1.25rem clamp(1rem, 4vw, 3rem) 2rem; gap: 1rem; position: relative; overflow: hidden; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
.topbar .round { font-family: var(--display); color: var(--gold); font-size: 1.15rem; }
.topbar .conn { margin-top: 0; }
.topbar .right { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
.center { display: grid; align-content: center; justify-items: center; gap: 1.6rem; text-align: center; }
.prompt { font-family: var(--display); font-size: clamp(2rem, 5.4vw, 4.4rem); line-height: 1.04; max-width: 20ch; }
.prompt.small { font-size: clamp(1.2rem, 2.6vw, 1.9rem); color: var(--muted); max-width: 34ch; }
.tally { display: flex; align-items: baseline; gap: .5rem; font-size: 1.3rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tally .big-num { font-family: var(--display); font-size: 3.4rem; color: var(--ink); line-height: 1; }
.voters { justify-content: center; max-width: 900px; }
.voters .chip { padding: .4rem .9rem; opacity: .45; }
.voters .chip.voted { opacity: 1; border-color: var(--sage); background: #2c3626; }
.voters .chip.voted::after { content: "✓"; color: var(--sage); font-weight: 700; }
.actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }

/* ---------- Reveal ---------- */
.reveal-wrap { display: grid; justify-items: center; gap: 1.2rem; text-align: center; position: relative; }
.drum { display: none; }
.animate .drum { display: block; position: absolute; inset: 0; pointer-events: none; }
.animate .drum span {
  position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: clamp(6rem, 18vw, 11rem);
  line-height: 1; color: var(--gold); opacity: 0; animation: tick 1s ease-out both;
}
.animate .drum span:nth-child(2) { animation-delay: 1s; }
.animate .drum span:nth-child(3) { animation-delay: 2s; }
@keyframes tick { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: 1; transform: scale(1.08); } 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.4); } }
.animate .after { animation: rise .6s cubic-bezier(.2,.9,.3,1.3) 3s both; }
.animate .after.late { animation-delay: 3.5s; }
.animate .reveal-wrap { min-height: clamp(8rem, 22vw, 13rem); }
.animate .reveal-wrap > .prompt, .animate .reveal-wrap > .p-prompt { animation: dim 3s ease both; }
@keyframes dim { 0%, 90% { opacity: .25; } 100% { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.94); } to { opacity: 1; transform: none; } }
.winner-label { font-size: .95rem; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 600; }
.winner { font-family: var(--display); font-size: clamp(3rem, 10vw, 7.5rem); line-height: .95; color: var(--gold); text-shadow: 0 6px 40px rgba(242,177,52,.25); overflow-wrap: anywhere; }
.winner.none { color: var(--muted); font-size: clamp(2rem, 6vw, 3.5rem); }
.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; width: min(640px, 100%); }
.bars li { display: grid; grid-template-columns: minmax(6rem, 11rem) 1fr 2.2rem; gap: .75rem; align-items: center; text-align: left; }
.bars .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .track, .bars .fill { display: block; }
.bars .track { height: .8rem; background: #3a1f34; border-radius: 999px; overflow: hidden; }
.bars .fill { height: 100%; background: var(--muted); border-radius: 999px; }
.bars li.top .fill { background: var(--gold); }
.bars li.top .nm { font-weight: 700; }
.bars .n { font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
canvas.confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* ---------- Done ---------- */
.done { max-width: 960px; margin: 0 auto; padding: 2rem 1.25rem 3rem; display: grid; gap: 1.5rem; }
.done h1 { font-family: var(--display); font-size: clamp(2.2rem, 6vw, 4rem); line-height: .95; color: var(--gold); }
.done .mvp { color: var(--muted); font-size: 1.1rem; }
.done .mvp strong { color: var(--ink); }
.awards-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; counter-reset: aw; }
.awards-list li { counter-increment: aw; display: grid; grid-template-columns: 2.2rem 1fr auto; gap: .9rem; align-items: baseline; padding: .85rem 1rem; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
.awards-list li::before { content: counter(aw); font-family: var(--display); color: var(--gold); font-size: 1.2rem; }
.awards-list .who { font-family: var(--display); color: var(--gold); font-size: 1.15rem; text-align: right; overflow-wrap: anywhere; }
.awards-list .who.none { color: var(--muted); font-family: var(--body); font-size: .95rem; font-style: italic; }

/* ---------- Overlay (pass-around ballot) ---------- */
.overlay { position: fixed; inset: 0; background: rgba(15,6,13,.92); display: grid; place-items: center; padding: 1rem; z-index: 10; }
.ballot { width: min(720px, 100%); max-height: 100%; overflow-y: auto; display: grid; gap: 1rem; text-align: center; }
.ballot h2 { font-size: 1.6rem; }
.ballot .q { font-family: var(--display); font-size: clamp(1.3rem, 3vw, 2rem); }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .6rem; }
.pick-grid .btn { border-radius: 16px; padding: .9rem .8rem; overflow-wrap: anywhere; }
.pick-grid .btn.had { border-color: var(--sage); }

/* ---------- Player ---------- */
.player { max-width: 520px; margin: 0 auto; min-height: 100%; padding: 1rem 1rem 2rem; display: grid; grid-template-rows: auto 1fr; gap: 1rem; }
.p-head { display: flex; justify-content: space-between; align-items: center; gap: .75rem; }
.p-head .mark { font-family: var(--display); color: var(--gold); font-size: 1.05rem; line-height: 1; }
.p-head .me { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: .35rem .8rem; cursor: pointer; font-size: .9rem; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-body { display: grid; align-content: start; gap: 1.1rem; }
.p-body.mid { align-content: center; text-align: center; justify-items: center; }
.p-title { font-family: var(--display); font-size: 2rem; line-height: 1.02; }
.p-prompt { font-family: var(--display); font-size: clamp(1.5rem, 7vw, 2.1rem); line-height: 1.08; }
.p-round { color: var(--gold); font-weight: 600; font-size: .9rem; letter-spacing: .08em; text-transform: uppercase; }
.nominees { display: grid; gap: .55rem; }
.nominee {
  display: flex; justify-content: space-between; align-items: center; gap: .75rem; width: 100%; text-align: left;
  padding: 1rem 1.1rem; border-radius: 18px; border: 1.5px solid var(--line); background: var(--panel); cursor: pointer; font-size: 1.12rem; font-weight: 600;
}
.nominee .tag { color: var(--muted); font-weight: 400; font-size: .85rem; }
.nominee.sel { background: var(--gold); border-color: var(--gold); color: #2a1408; }
.nominee.sel .tag { color: #5a3510; }
.nominee .nm { overflow-wrap: anywhere; }
.notice { border: 1px solid var(--line); border-left: 4px solid var(--cran); background: var(--panel); border-radius: 12px; padding: .75rem .9rem; font-size: .93rem; }
.name-form { display: grid; gap: .75rem; width: 100%; }
.name-form input { font-size: 1.2rem; padding: .85rem 1rem; text-align: center; }
.here-list { justify-content: center; }
.p-body .winner { font-size: clamp(2.4rem, 13vw, 4rem); }
.mine { color: var(--muted); }

@media (max-width: 860px) {
  .setup { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .animate .drum { display: none; }
}

/* ---------- Standalone additions ---------- */
.join-grid { display: grid; grid-template-columns: 170px 1fr; gap: 1.1rem; align-items: center; }
.qr { background: #fff; border-radius: 16px; padding: 10px; width: 170px; height: 170px; display: grid; place-items: center; }
.qr svg { width: 100%; height: 100%; display: block; }
.qr:empty { display: none; }
.join-steps { display: grid; gap: .25rem; }
.join-steps .url { font-weight: 600; overflow-wrap: anywhere; }
.room-code { font-family: var(--display); font-size: 2.6rem; line-height: 1; color: var(--gold); letter-spacing: .08em; }
.qr-missing { border: 1px dashed var(--line); border-radius: 12px; padding: .75rem; font-size: .9rem; color: var(--muted); }
.mini-join { display: inline-flex; gap: .4rem; align-items: baseline; color: var(--muted); font-size: .95rem; }
.mini-join b { font-family: var(--display); font-weight: 400; color: var(--ink); letter-spacing: .06em; font-size: 1.15rem; }
.join-form { display: grid; grid-template-columns: 1fr auto; gap: .5rem; }
.join-form input { text-transform: uppercase; letter-spacing: .15em; text-align: center; font-size: 1.2rem; }
.divider { color: var(--muted); font-size: .9rem; }
.corner-qr { position: absolute; right: clamp(1rem, 4vw, 3rem); bottom: 1.5rem; display: grid; justify-items: center; gap: .35rem; }
.corner-qr .qr { width: 104px; height: 104px; padding: 6px; border-radius: 12px; }
@media (max-width: 860px) { .corner-qr { display: none; } }
@media (max-width: 420px) { .join-grid { grid-template-columns: 1fr; } }
.join-grid.noqr { grid-template-columns: 1fr; }

/* ================= Retro night-drive theme ================= */
:root {
  --bg: #140a22; --panel: #21123a; --line: #41286a; --ink: #f4e4c1; --muted: #b7a3d6;
  --gold: #ffd23f; --orange: #ff8c42; --purple: #a066ff; --cran: #ff8c42; --sage: #ffd23f;
}
body { background: linear-gradient(180deg, #0d0618 0%, #1b0b31 42%, #34124a 70%, #140a22 100%) fixed; }
body::before {
  content: ""; position: fixed; left: 50%; bottom: 24vh; width: min(68vmin, 600px); aspect-ratio: 1; transform: translateX(-50%);
  border-radius: 50%; background: linear-gradient(180deg, #ffd23f 0%, #ff8c42 52%, #a066ff 100%);
  -webkit-mask-image: linear-gradient(180deg, #000 0 46%, transparent 46%), repeating-linear-gradient(180deg, #000 0 13px, transparent 13px 21px);
  mask-image: linear-gradient(180deg, #000 0 46%, transparent 46%), repeating-linear-gradient(180deg, #000 0 13px, transparent 13px 21px);
  opacity: .22; z-index: -2; pointer-events: none;
}
body::after {
  content: ""; position: fixed; left: -50%; right: -50%; bottom: 0; height: 40vh; z-index: -1; pointer-events: none;
  background-image: linear-gradient(rgba(160,102,255,.7) 2px, transparent 2px), linear-gradient(90deg, rgba(160,102,255,.7) 2px, transparent 2px);
  background-size: 64px 64px; transform: perspective(320px) rotateX(62deg); transform-origin: bottom center;
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 75%); mask-image: linear-gradient(180deg, transparent 0%, #000 75%);
  opacity: .32; animation: drive 1.4s linear infinite;
}
@keyframes drive { to { background-position: 0 64px; } }
#app { position: relative; z-index: 1; min-height: 100%; }
h2 { color: var(--orange); text-transform: uppercase; letter-spacing: .07em; }
.brand h1, .chooser .logo, .done h1 { color: var(--gold); text-shadow: 3px 3px 0 var(--purple), 6px 6px 0 rgba(255,140,66,.9); }
.brand h1 span, .chooser .logo span { color: var(--ink); }
.prompt { color: var(--ink); text-shadow: 3px 3px 0 var(--purple); }
.prompt.small { text-shadow: none; }
.p-title, .p-prompt { text-shadow: 2px 2px 0 var(--purple); }
.winner { color: var(--gold); text-shadow: 4px 4px 0 var(--purple), 8px 8px 0 var(--orange); }
.room-code { text-shadow: 3px 3px 0 var(--purple); }
.animate .drum span { color: var(--orange); text-shadow: 6px 6px 0 var(--purple); }
.card { background: rgba(33,18,58,.9); border: 2px solid var(--line); box-shadow: 6px 6px 0 rgba(160,102,255,.25); }
.btn { border: 2px solid var(--line); border-radius: 14px; box-shadow: 4px 4px 0 rgba(0,0,0,.5); }
.btn:hover { border-color: var(--purple); transform: translate(-1px, -1px); box-shadow: 5px 5px 0 rgba(0,0,0,.5); }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 rgba(0,0,0,.5); }
.btn.primary { background: var(--gold); color: #1a0b2c; border-color: #1a0b2c; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; box-shadow: 4px 4px 0 var(--orange), 8px 8px 0 var(--purple); }
.btn.primary:hover { background: #ffe066; box-shadow: 5px 5px 0 var(--orange), 9px 9px 0 var(--purple); }
.btn.primary:active { box-shadow: 1px 1px 0 var(--orange), 2px 2px 0 var(--purple); }
.btn.ghost, .btn.ghost:hover, .btn.ghost:active { background: transparent; box-shadow: none; transform: none; }
.btn:disabled, .btn:disabled:hover { box-shadow: none; transform: none; }
.chip { background: #2b1749; border: 2px solid var(--line); }
.chip .dot.on { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.voters .chip.voted { border-color: var(--gold); background: #3b2913; }
.voters .chip.voted::after { color: var(--gold); }
input[type=text], select, textarea { background: #170b28; border: 2px solid var(--line); }
.conn.ok::before { background: var(--gold); box-shadow: 0 0 0 4px rgba(255,210,63,.18), 0 0 10px var(--gold); }
.conn.bad::before { background: var(--orange); }
.nominee { border: 2px solid var(--line); box-shadow: 4px 4px 0 rgba(0,0,0,.45); transition: transform .08s ease; }
.nominee:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 rgba(0,0,0,.45); }
.nominee.sel { background: var(--gold); color: #1a0b2c; border-color: #1a0b2c; box-shadow: 4px 4px 0 var(--orange), 7px 7px 0 var(--purple); }
.nominee.sel .tag { color: #5b3a00; }
.bars .track { background: #2b1749; }
.bars .fill { background: var(--purple); }
.bars li.top .fill { background: linear-gradient(90deg, var(--orange), var(--gold)); }
.overlay { background: rgba(13,6,24,.95); }
.awards-list li { border: 2px solid var(--line); box-shadow: 4px 4px 0 rgba(0,0,0,.35); background: rgba(33,18,58,.92); }
.awards-list li::before { color: var(--orange); }
.p-round { color: var(--orange); }
.qr { box-shadow: 5px 5px 0 var(--purple); }
.p-head .me { border: 2px solid var(--line); }

/* ---------- Question intro ---------- */
.q-eyebrow {
  display: inline-block; justify-self: center; font-family: var(--display); text-transform: uppercase; letter-spacing: .12em;
  font-size: clamp(1rem, 2.2vw, 1.4rem); color: #1a0b2c; background: var(--orange); padding: .35rem .95rem .3rem;
  border-radius: 10px; transform: rotate(-3deg); box-shadow: 4px 4px 0 var(--purple);
}
.p-body .q-eyebrow { justify-self: start; font-size: 1rem; }
.p-body.mid .q-eyebrow { justify-self: center; }
.intro .q-eyebrow, .animate-board .q-eyebrow { animation: slam .55s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes slam { from { opacity: 0; transform: scale(2.6) rotate(-14deg); } to { opacity: 1; transform: scale(1) rotate(-3deg); } }
.intro .w { display: inline-block; animation: wordIn .5s cubic-bezier(.2,1.3,.4,1) both; }
@keyframes wordIn { from { opacity: 0; transform: translateY(.6em) scale(.7) rotate(-6deg); } to { opacity: 1; transform: none; } }
.intro .after-q { animation: rise .5s ease both; animation-delay: var(--qd, 1.4s); }

/* ---------- Leaderboard ---------- */
.board { gap: 1rem; }
.lb { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; width: min(860px, 100%); text-align: left; }
.lb li {
  display: grid; grid-template-columns: 2.4rem minmax(7rem, 15rem) 1fr auto 2.6rem; gap: .9rem; align-items: center;
  padding: .55rem .9rem; background: rgba(33,18,58,.92); border: 2px solid var(--line); border-radius: 14px; box-shadow: 4px 4px 0 rgba(0,0,0,.35);
}
.animate-board .lb li { animation: rise .45s ease both; animation-delay: calc(var(--i) * 90ms + .4s); }
.lb .rk { display: grid; place-items: center; width: 2.3rem; height: 2.3rem; border-radius: 9px; background: var(--line); color: var(--ink); font-family: var(--display); font-size: 1.15rem; }
.lb li.r1 .rk { background: var(--gold); color: #1a0b2c; }

const WHEEL_COLORS = ["#a066ff", "#ff8c42", "#ffd23f", "#f4e4c1", "#6b3fc4", "#e0662a"];
function wheelAngle(n, target) { const seg = 2 * Math.PI / n; return ((-Math.PI / 2 - (target + .5) * seg) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI); }
function drawWheel(canvas, names, rot) {
  const ctx = canvas && canvas.getContext("2d"); if (!ctx) return;
  const W = canvas.width, R = W / 2 - 8, n = Math.max(1, names.length), seg = 2 * Math.PI / n;
  ctx.clearRect(0, 0, W, W);
  ctx.save(); ctx.translate(W / 2, W / 2); ctx.rotate(rot);
  for (let i = 0; i < n; i++) {
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, i * seg, (i + 1) * seg); ctx.closePath();
    ctx.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length]; ctx.fill();
    ctx.strokeStyle = "#140a22"; ctx.lineWidth = 3; ctx.stroke();
    ctx.save(); ctx.rotate((i + .5) * seg); ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillStyle = [2, 3].includes(i % WHEEL_COLORS.length) ? "#1a0b2c" : "#fff8ea";
    ctx.font = `700 ${n > 10 ? 16 : 20}px Outfit, system-ui, sans-serif`;
    const label = names[i].length > 14 ? names[i].slice(0, 13) + "…" : names[i];
    ctx.fillText(label, R - 16, 0); ctx.restore();
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(W / 2, W / 2, 30, 0, 2 * Math.PI); ctx.fillStyle = "#140a22"; ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = "#ffd23f"; ctx.stroke();
  ctx.beginPath(); ctx.arc(W / 2, W / 2, R + 4, 0, 2 * Math.PI); ctx.lineWidth = 6; ctx.strokeStyle = "#ffd23f"; ctx.stroke();
}
function spinWheel(canvas, names, target, dur, done) {
  const n = names.length, seg = 2 * Math.PI / n;
  const final = wheelAngle(n, target) + 2 * Math.PI * 6 + (Math.random() - .5) * seg * .5;
  const t0 = performance.now();
  let lastSeg = -1;
  (function frame(now) {
    if (!document.body.contains(canvas)) return;
    const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 4), rot = final * e;
    drawWheel(canvas, names, rot);
    const under = Math.floor((((-Math.PI / 2 - rot) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI)) / seg);
    if (under !== lastSeg) { lastSeg = under; sfx("tick"); }
    if (t < 1) requestAnimationFrame(frame); else done();
  })(t0);
}

/* ---- Leaderboard ---- */
function lbHTML(cur, prev, opts) {
  const prevMap = new Map((prev || []).map(e => [e.key, e]));
  const max = Math.max(1, ...cur.map(e => e.pts));
  let rows = cur.slice(0, opts.limit);
  if (opts.me) { const mine = cur.find(e => e.key === opts.me); if (mine && !rows.includes(mine)) rows = rows.concat(mine); }
  if (!rows.length) return `<p class="empty">Nobody on the board yet.</p>`;
  return `<ol class="lb">${rows.map((e, i) => {
    const p = prevMap.get(e.key);
    const from = p && opts.animate ? Math.max(0, p.pts) : Math.max(0, e.pts);
    const mv = prev && p ? p.rank - e.rank : 0;
    const stars = e.wins ? `<span class="aw" aria-label="${plural(e.wins, "award")}">${"★".repeat(Math.min(e.wins, 5))}${e.wins > 5 ? "+" : ""}</span>` : "";
    return `<li class="${e.rank <= 3 && e.pts > 0 ? "r" + e.rank : ""} ${e.key === opts.me ? "me" : ""}" style="--i:${i}">
      <span class="rk">${e.rank}</span>
      <span class="nm"><span class="nmt">${esc(e.name)}</span>${e.key === opts.me ? "<em>(you)</em>" : ""}${stars}</span>
      <span class="track"><span class="fill" data-to="${Math.round(Math.max(0, e.pts) / max * 100)}" style="width:${Math.round(from / max * 100)}%"></span></span>
      <span class="meta"><b>${e.pts}</b> pt${e.pts === 1 ? "" : "s"}</span>
      <span class="mv ${mv > 0 ? "up" : mv < 0 ? "down" : ""}">${mv > 0 ? "▲" + mv : mv < 0 ? "▼" + (-mv) : ""}</span>
    </li>`;
  }).join("")}</ol>`;
}
function hostRows() {
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  return Math.max(3, Math.min(10, Math.floor((window.innerHeight - 15 * rem) / (3.6 * rem))));
}
function settleBars(root, animate) {
  const go = () => root.querySelectorAll(".lb .fill[data-to]").forEach(f => { f.style.width = f.dataset.to + "%"; });
  if (animate) requestAnimationFrame(() => requestAnimationFrame(go)); else go();
}
function boardInner(isHost, animate) {
  const cur = standings(S.idx), prev = S.idx > 0 ? standings(S.idx - 1) : null;
  const r = S.results[S.idx], wt = winnerText(r);
  const sub = `After ${S.idx + 1} of ${S.prompts.length} awards${wt ? ` · ${esc(wt)} just took one home` : ""}`;
  if (isHost) return `<p class="q-eyebrow">Leaderboard</p><p class="fine">${sub}</p>${lbHTML(cur, prev, { limit: hostRows(), animate })}<p class="fine">${RULE_LINE}</p>`;
  const me = cur.find(e => e.key === myKey);
  const head = !me ? "" : me.pts <= 0 ? `<h1 class="p-title">Not on the board yet</h1>` : `<h1 class="p-title">You're #${me.rank}</h1><p class="fine">${plural(me.pts, "point")} so far.</p>`;
  return `<p class="q-eyebrow">Leaderboard</p>${head}${lbHTML(cur, prev, { limit: 5, me: myKey, animate })}<p class="fine">${RULE_LINE}</p>`;
}

          const left = S.ddLeft[myKey] || 0;
          html += `<button class="dd-toggle ${v.dd ? "on" : ""}" data-act="dd" ${left <= 0 && !v.dd ? "disabled" : ""} aria-pressed="${v.dd ? "true" : "false"}">
            <span>⚡ Double Down ${v.dd ? "ON" : "off"}</span><small>${left <= 0 ? "None left" : `${plural(left, "left")} · makes this vote count ×2`}</small></button>`;
        }
        if (v && S.opts.oracle) {
          const pp = myPred && myPred.g === S.gameId && myPred.r === S.idx ? myPred.pick : null;
          html += `<div class="oracle"><p class="oracle-head">🔮 Oracle bet: who'll actually win? <small>+${PTS_ORACLE} if you're right</small></p>
            <div class="oracle-chips">${S.roster.map(r => `<button class="ochip ${pp === r.key ? "sel" : ""}" data-act="pred" data-key="${esc(r.key)}">${esc(r.name)}${r.key === myKey ? " (you)" : ""}</button>`).join("")}</div></div>`;
        }
        ex.innerHTML = html;
      }
      const vh = document.getElementById("votehint");
      if (vh) {
        const pn = v ? (S.roster.find(x => x.key === v.pick) || {}).name : null;
        vh.innerHTML = pn ? `Your vote: <b>${esc(pn)}</b>${v.dd ? " ×2" : ""}. Tap another name to change it.` : "Tap a name. Your vote stays secret.";
      }
    }
    const jb = document.getElementById("jurybtns");
    if (jb) {
      const mine = myJury && myJury.g === S.gameId && myJury.r === S.idx ? myJury.v : null;
      jb.innerHTML = `<button class="jbtn g ${mine === "g" ? "sel" : ""}" data-act="jury" data-key="g">GUILTY</button><button class="jbtn a ${mine === "a" ? "sel" : ""}" data-act="jury" data-key="a">NOT GUILTY</button>`;
    }
  }
}
function renderPending() {
  let el = document.getElementById("pendingBar");
  if (!el) { el = document.createElement("div"); el.id = "pendingBar"; document.body.appendChild(el); }
  const show = mode === "host" && S.pending.length && S.phase !== "setup";
  el.className = show ? "pending-bar on" : "pending-bar";
  el.innerHTML = show ? S.pending.slice(0, 3).map(p => `<div class="pend"><span><b>${esc(p.name)}</b> wants to join</span><button class="btn primary" data-act="admit" data-key="${esc(p.key)}">Let in</button><button class="btn ghost" data-act="deny" data-key="${esc(p.key)}">No</button></div>`).join("") : "";
}
function renderPauseLayer() {
  let el = document.getElementById("pauseLayer");
  if (!el) { el = document.createElement("div"); el.id = "pauseLayer"; document.body.appendChild(el); }
  const show = S.paused && mode && (mode === "host" || stateSeen) && !["setup", "done"].includes(S.phase);
  el.className = show ? "pause-layer on" : "pause-layer";
  el.innerHTML = show ? `<div><p class="q-eyebrow">⏸ Paused</p><h2 class="pause-title">The table is talking.</h2><p class="fine">The game waits for you.</p>${mode === "host" ? `<button class="btn primary big" data-act="pause">Resume</button>` : ""}</div>` : "";
}
function renderCohostBar() {
  let el = document.getElementById("cobar");
  if (!el) { el = document.createElement("div"); el.id = "cobar"; document.body.appendChild(el); }
  const show = mode === "player" && stateSeen && S.cohost === myKey && !kicked && S.phase !== "done";
  el.className = show ? "cobar on" : "cobar";
  el.innerHTML = show ? `<span class="co-tag">👑 Co-host</span>
    ${S.phase !== "setup" ? `<button class="btn" data-act="co-pause">${S.paused ? "▶ Resume" : "⏸ Pause"}</button>` : ""}
    <button class="btn primary" data-act="co-next">${esc(nextLabel())} ▶</button>` : "";
  document.body.classList.toggle("has-cobar", show);
}
function renderBallot() {
  const ov = document.getElementById("overlay");
  if (!ov) return;
  if (!ballot) { ov.innerHTML = ""; return; }
  if (ballot.step === "who") {
    ov.innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-label="Vote on this screen"><div class="ballot">
      <div class="ballot-top"><h2>Who's voting?</h2>
      <p class="fine">For people without a working phone. Pass the device around: tap your own name, then pick in secret. People with a phone connected vote on their phone.</p>
      <div><button class="btn" data-act="b-close">Done voting</button></div></div>
      <div class="pick-grid">${S.roster.filter(r => !online.has(r.key)).map(r => `<button class="btn ${votes.has(r.key) ? "had" : ""}" data-act="b-who" data-key="${esc(r.key)}">${esc(r.name)}${votes.has(r.key) ? " ✓" : ""}</button>`).join("")}</div>
    </div></div>`;
  } else if (ballot.step === "pick") {
    const voter = S.roster.find(r => r.key === ballot.voter);
    ov.innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-label="Secret ballot"><div class="ballot">
      <div class="ballot-top"><p class="fine">${esc(voter ? voter.name : "")}, cover the screen.</p>
      <p class="q">${esc(S.prompts[S.idx] || "")}</p>
      <div><button class="btn ghost" data-act="b-back">Back</button></div></div>
      <div class="pick-grid">${S.roster.filter(r => r.key !== ballot.voter).map(r => `<button class="btn" data-act="b-pick" data-key="${esc(r.key)}">${esc(r.name)}</button>`).join("")}</div>
    </div></div>`;
  } else {
    ov.innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-label="Vote saved"><div class="ballot">
      <h2>Vote saved</h2><p class="fine">Pass it to the next person.</p>
      <div class="actions"><button class="btn primary big" data-act="b-next">Next voter</button><button class="btn" data-act="b-close">Done voting</button></div>
    </div></div>`;
  }
}

/* ---------------- Confetti ---------------- */
function confetti(canvas) {
  if (reduceMotion) return;
  const ctx = canvas.getContext("2d"); if (!ctx) return;
  const dpr = window.devicePixelRatio || 1, W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr; ctx.scale(dpr, dpr);
  const cols = ["#ffd23f", "#ff8c42", "#a066ff", "#f4e4c1", "#c9a7ff"];
  const ps = Array.from({ length: 170 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .35, y: H * .4, vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 5, s: 5 + Math.random() * 7, c: cols[(Math.random() * cols.length) | 0], r: Math.random() * 6, vr: (Math.random() - .5) * .3 }));
  let t = 0;
  (function frame() {
    ctx.clearRect(0, 0, W, H);
    for (const p of ps) { p.vy += .32; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
    if (++t < 220 && document.body.contains(canvas)) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  })();
}

/* ---------------- Events ---------------- */
document.addEventListener("click", () => { if (mode === "host") audio(); }, true);
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act = el.dataset.act, key = el.dataset.key;
  if (["next", "skip", "vote", "co-next"].includes(act) && Date.now() < lockUntil) return;
  switch (act) {
    case "go-host": startHost(); break;
    case "start": startGame(); break;
    case "next": hostAdvance(); break;
    case "remove": if (key) removePerson(key); break;
    case "lock": S.locked = !S.locked; commit(); el.textContent = S.locked ? "🔒" : "🔓"; break;
    case "admit": if (key) admit(key, true); break;
    case "deny": if (key) admit(key, false); break;
    case "cohost": if (key) { S.cohost = S.cohost === key ? null : key; commit(); } break;
    case "reset-prompts": { promptText = DEFAULT_PROMPTS.join("\n"); LS.set("fsg.prompts", promptText); const ta = document.getElementById("prompts"); if (ta) ta.value = promptText; renderDynamic(); break; }
    case "skip": skipAward(); break;
    case "end": endEarly(); break;
    case "again": backToSetup(); break;
    case "pause": setPaused(!S.paused); break;
    case "sound": soundOn = !soundOn; LS.set("fsg.sound", soundOn ? "1" : "0"); el.textContent = soundOn ? "🔊" : "🔇"; break;
    case "copy": {
      const lines = [`The ${YEAR} Friendsgiving Awards`, ""].concat(S.prompts.map((p, i) => `${i + 1}. ${p}: ${winnerText(S.results[i]) || "no winner"}`));
      if (S.meta.length) lines.push("", "End-of-night awards", ...S.meta.map(m => `${m.emoji} ${m.title}: ${m.who}`));
      const out = document.getElementById("copied");
      Promise.resolve().then(() => navigator.clipboard.writeText(lines.join("\n")))
        .then(() => { if (out) out.textContent = "Copied."; })
        .catch(() => { if (out) out.textContent = "Couldn't copy here. Take a photo of the screen instead."; });
      break;
    }
    case "ballot": ballot = { step: "who" }; renderBallot(); break;
    case "b-who": if (online.has(key)) break; ballot = { step: "pick", voter: key }; renderBallot(); break;
    case "b-pick": if (ballot && ballot.voter && key !== ballot.voter && S.roster.some(r => r.key === key) && S.phase === "vote") { const prev = votes.get(ballot.voter); votes.set(ballot.voter, { pick: key, dd: prev ? prev.dd : false }); saveHost(); ballot = { step: "done" }; renderDynamic(); } break;
    case "b-back": case "b-next": ballot = { step: "who" }; renderBallot(); break;
    case "b-close": ballot = null; renderBallot(); break;
    case "vote": if (key && S.phase === "vote") castVote(key); break;
    case "dd": toggleDD(); break;
    case "pred": if (key && S.phase === "vote") castPred(key); break;
    case "jury": if (key === "g" || key === "a") castJury(key); break;
    case "co-next": send({ t: "ctl", act: "next" }); break;
    case "co-pause": send({ t: "ctl", act: S.paused ? "resume" : "pause" }); break;
    case "rename": renaming = true; render(); break;
    case "new-code": {
      clearTimeout(retryTimer);
      try { if (peer) peer.destroy(); } catch (err) {} peer = null; hostConn = null;
      mode = null; net = "idle"; stateSeen = false;
      history_replace(location.pathname);
      render(); break;
    }
  }
});
document.addEventListener("keydown", e => {
  if (mode !== "host") return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
  if (e.key === "Escape" && ballot) { ballot = null; renderBallot(); return; }
  if (ballot) return;
  if (e.key === "p" || e.key === "P") { setPaused(!S.paused); return; }
  if (e.key === "ArrowRight") {
    if (e.repeat || Date.now() < lockUntil || S.phase === "setup") return;
    lock(900);
    lockUntil = 0; hostAdvance(); lock(900);
  }
});

/* ---------------- Boot ---------------- */
function startHost() {
  mode = "host";
  restoreHost();
  const saved = cleanCode(LS.get("fsg.room")), savedAt = +LS.get("fsg.roomAt") || 0;
  const resuming = saved && S.phase !== "done" && Date.now() - savedAt < 12 * 3600 * 1000 && (S.phase !== "setup" || S.roster.length);
  if (!resuming) {
    const keepOpts = S.opts;
    S = blankState(); S.opts = keepOpts || defaultOpts();
    history = []; votes.clear(); preds.clear(); jury.clear(); secrets.clear();
  }
  roomCode = resuming ? saved : newCode();
  LS.set("fsg.room", roomCode);
  stateSeen = true;
  history_replace(location.pathname + "#host");
  render(); openHost();
}
function startPlayer() { mode = "player"; render(); playerConnect(); }

if (roomCode) startPlayer();
else if (location.hash === "#host") startHost();
else render();
})();
</script>
